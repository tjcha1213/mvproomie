name: Deploy GitHub Pages

# Deploy tick: 2026-07-03T08:15:29Z

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Include static overview and sibling MVP pages
        run: |
          cp -f index.html tenant-surveys.html host-surveys.html survey-admin.html styles.css survey-storage.js demo-layout-1.js dist/
          cp -f dist/tenant-surveys.html dist/user-surveys.html
          cp -f dist/host-surveys.html dist/landlord-surveys.html
          mkdir -p dist/mvp1
          mkdir -p dist/assets
          cp -f assets/logo-draft.png assets/mvp1-static.png assets/mvp2-static.png assets/mvp3-static.png dist/assets/
          cp -f mvp1/detail.html mvp1/saved.html mvp1/internal.html dist/mvp1/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
